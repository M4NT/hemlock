name: Hemlock Continuous Security
description: Run scheduled Hemlock orchestrator scan with executive report artifacts

inputs:
  org-name:
    description: Organization name for executive reports
    required: false
    default: 'Your Organisation'
  schedule-name:
    description: Schedule to run (empty = all due schedules)
    required: false
    default: ''
  risk-preset:
    description: 'Risk preset: default|fintech|healthcare|saas'
    required: false
    default: ''
  executive-report:
    description: Generate executive report artifacts
    required: false
    default: 'true'
  policy:
    description: Optional policy YAML/JSON for gate after orchestrate
    required: false
    default: ''
  baseline:
    description: Optional baseline JSON for policy gate comparison
    required: false
    default: ''
  hemlock-version:
    description: hemlock-rag version to install (default latest)
    required: false
    default: ''

outputs:
  risk-score:
    description: Risk score from latest orchestrator run
    value: ${{ steps.orchestrate.outputs.risk-score }}
  executive-report:
    description: Path to latest executive markdown report
    value: ${{ steps.orchestrate.outputs.executive-report }}
  gate-passed:
    description: Whether optional policy gate passed
    value: ${{ steps.orchestrate.outputs.gate-passed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Hemlock
      shell: bash
      run: |
        if [ -n "${{ inputs.hemlock-version }}" ]; then
          pip install "hemlock-rag==${{ inputs.hemlock-version }}"
        else
          pip install -e ".[dev]" 2>/dev/null || pip install "hemlock-rag"
        fi

    - name: Run orchestrator
      id: orchestrate
      shell: bash
      run: |
        set +e
        ARGS=(orchestrate --org "${{ inputs.org-name }}")
        if [ -n "${{ inputs.schedule-name }}" ]; then
          ARGS+=(--schedule "${{ inputs.schedule-name }}")
        fi
        if [ -n "${{ inputs.risk-preset }}" ]; then
          ARGS+=(--risk-preset "${{ inputs.risk-preset }}")
        fi
        if [ "${{ inputs.executive-report }}" != "true" ]; then
          ARGS+=(--no-executive-report)
        fi
        hemlock "${ARGS[@]}"
        EXIT=$?

        python - <<'PYEOF'
        import json, os

        runs_path = ".hemlock/orchestrator_runs.jsonl"
        risk = 0
        exec_path = ".hemlock/reports/executive_latest.md"
        if os.path.exists(runs_path):
            with open(runs_path) as f:
                lines = [l.strip() for l in f if l.strip()]
            if lines:
                last = json.loads(lines[-1])
                risk = last.get("risk_score", 0)
                exec_path = last.get("executive_report_path", exec_path) or exec_path

        with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"risk-score={risk}\n")
            fh.write(f"executive-report={exec_path}\n")
            fh.write("gate-passed=true\n")
        PYEOF

        if [ $EXIT -ne 0 ]; then
          echo "::error::Hemlock orchestrate failed"
          exit $EXIT
        fi

    - name: Optional policy gate
      if: inputs.policy != ''
      shell: bash
      run: |
        GATE_ARGS=(gate --baseline "${{ inputs.baseline }}")
        if [ -z "${{ inputs.baseline }}" ]; then
          echo "::warning::Policy set but no baseline — skipping gate"
          exit 0
        fi
        GATE_ARGS+=(--policy "${{ inputs.policy }}")
        if [ -n "${{ inputs.risk-preset }}" ]; then
          GATE_ARGS+=(--risk-preset "${{ inputs.risk-preset }}")
        fi
        hemlock "${GATE_ARGS[@]}" --save .hemlock/reports/gate_latest.json
        echo "gate-passed=true" >> "$GITHUB_OUTPUT"
