# MCP fleet audit — example configuration (v9.2)
#
# Copy to mcp-fleet.local.yaml and set tokens via environment variables.
# Never commit real tokens to git.

org: Multipli

targets:
  - name: admin-mcp
    url: http://192.168.3.3:3005/mcp
    auth_token_env: MCP_AUTH_TOKEN

  - name: capability-router-mcp
    url: http://192.168.3.3:3011/mcp
    auth_token_env: MCP_AUTH_TOKEN

  - name: imap-mcp
    url: http://192.168.3.3:3001/mcp
    auth_mode: oauth_bearer
    oauth_resource: https://imap-mcp.multipli.com.br/mcp
    oauth_token_env: IMAP_MCP_OAUTH_TOKEN
    expect_auth_failure: true
    notes: Run hemlock mcp-oauth login --url http://192.168.3.3:3001/mcp

  - name: nextcloud-mcp
    url: http://192.168.3.3:3002/mcp
    auth_mode: oauth_bearer
    oauth_resource: https://nextcloud-mcp.multipli.com.br/mcp
    oauth_token_env: NEXTCLOUD_MCP_OAUTH_TOKEN
    expect_auth_failure: true
    notes: Run hemlock mcp-oauth login --url http://192.168.3.3:3002/mcp
