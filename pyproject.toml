[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hemlock-rag"
version = "7.6.0"
description = "AI security lab â€” attack and defense testing for RAG pipelines and tool-using agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "M4NT" }]
keywords = ["rag", "security", "llm", "prompt-injection", "red-team", "ai-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "chromadb>=0.5.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "sentence-transformers>=3.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0", "anthropic>=0.40.0"]
openai    = ["langchain-openai>=0.2.0", "openai>=1.0.0"]
ollama    = ["langchain-ollama>=0.2.0"]
mcp       = ["mcp>=1.0.0"]
api       = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
all       = [
    "langchain-anthropic>=0.3.0", "anthropic>=0.40.0",
    "langchain-openai>=0.2.0", "openai>=1.0.0",
    "langchain-ollama>=0.2.0",
    "mcp>=1.0.0",
    "fastapi>=0.110.0", "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
hemlock = "hemlock.cli:app"

[project.urls]
Homepage   = "https://github.com/M4NT/hemlock"
Repository = "https://github.com/M4NT/hemlock"
Issues     = "https://github.com/M4NT/hemlock/issues"

# â”€â”€ Hatchling build config â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

[tool.hatch.build.targets.wheel]
# attacks/ and defenses/ are top-level packages alongside hemlock/
packages = ["hemlock", "attacks", "defenses"]

[tool.hatch.build.targets.sdist]
include = [
    "hemlock/",
    "attacks/",
    "defenses/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".env.example",
]
exclude = [
    "*.pyc",
    "__pycache__/",
    ".hemlock/",
    "*.egg-info/",
]

# â”€â”€ Ruff â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# â”€â”€ Pytest â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]
